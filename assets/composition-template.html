<!doctype html>
<!--
  voiceover-course-video 脱敏模板骨架
  =====================================
  用法：
  1. 复制本文件到项目 index.html，替换以下占位：
     - CSS 变量 --accent / --accent-deep / --ink / --paper（你的品牌三色方案）
     - BRAND_EN（左上角英文品牌，不需要则删除该元素）
     - BRAND_ZH（左侧竖排中文品牌，不需要则删除该元素）
     - <FONT_HEAVY> / <FONT_REGULAR>（字体文件名，放在 fonts/）
     - <AUDIO_DURATION>（根与 <audio> 的 data-duration = 口播音频总时长秒）
     - 示例页文案与页码 NN（当前页/总页数）
  2. 按注释"复制 section 模式"扩展实际页数：每页一个 <section id="pNN" class="clip pg-…">，
     背景类 pg-dark / pg-light / pg-orange 交替；CSS 已含 #p01–#p21 全量排版样式，
     复制对应 #pNN 样式块并改用你的页 id 即可。
  3. 内容单元 data-u = 该单元绑定口播词的绝对时间 − 页面 data-start（秒，30fps 帧级）。
     完整句子/卡片为一个单元，禁止拆字；未说到的内容不提前出现。
  4. 动画引擎已内嵌（0.38s ease-out 短距滑入/淡入、页间 0.12s 快速淡入淡出、末页 0.4s 淡出），
     无需手写动画，只改 data-u / data-kind。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>课程课件</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PHT-H"; src: url("fonts/<FONT_HEAVY>.ttf") format("truetype"); }
      @font-face { font-family: "PHT-R"; src: url("fonts/<FONT_REGULAR>.ttf") format("truetype"); }
      /* 品牌三色方案：主色 / 深主色 / 深色 / 浅色（替换为你的配色） */
      :root {
        --accent: #2F6FED; --accent-deep: #1E4FB0;
        --ink: #1A1A1A; --paper: #FFFFFF;
        --ink-rgb: 26, 26, 26; --paper-rgb: 255, 255, 255;
      }
      html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      body { font-family: "PHT-R", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      /* ---------- 通用：页面层 ---------- */
      .clip { position: absolute; inset: 0; }
      .page { position: absolute; inset: 0; overflow: hidden; }
      .pg-dark   { background: var(--ink); }
      .pg-light  { background: var(--paper); }
      .pg-orange { background: var(--accent); }

      .grid { position: absolute; inset: 0; pointer-events: none;
        background-image:
          linear-gradient(rgba(var(--paper-rgb), 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(var(--paper-rgb), 0.055) 1px, transparent 1px);
        background-size: 72px 72px; }
      .pg-light .grid { background-image:
          linear-gradient(rgba(var(--ink-rgb), 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(var(--ink-rgb), 0.055) 1px, transparent 1px); }
      .pg-orange .grid { background-image:
          linear-gradient(rgba(var(--ink-rgb), 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(var(--ink-rgb), 0.07) 1px, transparent 1px); }

      /* ---------- 固定元素（每页自带，随页淡入） ---------- */
      .brand { position: absolute; top: 40px; left: 52px; font-family: "PHT-R"; font-size: 26px; letter-spacing: 0.24em; z-index: 5; }
      .pg-dark .brand { color: var(--paper); }
      .pg-light .brand, .pg-orange .brand { color: var(--ink); }
      .brand-v { position: absolute; left: 44px; top: 50%; transform: translateY(-50%);
        writing-mode: vertical-rl; text-orientation: upright;
        font-family: "PHT-R"; font-size: 24px; letter-spacing: 0.34em; z-index: 5; }
      .pg-dark .brand-v { color: rgba(var(--paper-rgb), 0.62); }
      .pg-light .brand-v, .pg-orange .brand-v { color: rgba(var(--ink-rgb), 0.62); }
      .pageno { position: absolute; right: 52px; bottom: 40px; font-family: "PHT-H"; font-size: 30px; z-index: 5; }
      .pageno b { font-weight: normal; }
      .pageno i { font-style: normal; opacity: 0.55; margin-left: 6px; }
      .pg-dark .pageno { color: var(--paper); }
      .pg-light .pageno, .pg-orange .pageno { color: var(--ink); }

      .content { position: absolute; inset: 0; z-index: 2; }
      .h { font-family: "PHT-H"; }
      .r { font-family: "PHT-R"; }

      /* ---------- P01 大标题压屏（深） ---------- */
      #p01 .content { display: flex; flex-direction: column; justify-content: center; align-items: center; padding-left: 90px; }
      #p01 .rule { width: 120px; height: 10px; background: var(--accent); margin-bottom: 44px; }
      #p01 .t { font-family: "PHT-H"; color: var(--paper); font-size: 170px; letter-spacing: 0.02em; line-height: 1.05; text-align: center; }
      #p01 .k { margin-top: 40px; font-size: 32px; color: rgba(var(--paper-rgb), 0.6); letter-spacing: 0.18em; }

      /* ---------- P02 开放式分栏（浅） ---------- */
      #p02 .content { display: flex; padding: 0 140px 0 150px; align-items: center; }
      #p02 .col-l { flex: 0 0 58%; }
      #p02 .col-l .a { font-family: "PHT-H"; color: var(--ink); font-size: 104px; line-height: 1.16; }
      #p02 .col-l .b { font-family: "PHT-H"; color: var(--ink); font-size: 74px; line-height: 1.2; margin-top: 10px; }
      #p02 .divider { width: 6px; align-self: stretch; background: var(--accent); margin: 0 80px; }
      #p02 .col-r { flex: 1; }
      #p02 .col-r .who { font-size: 30px; color: var(--ink); opacity: 0.55; margin-bottom: 18px; letter-spacing: 0.2em; }
      #p02 .col-r .q { font-family: "PHT-H"; color: var(--ink); font-size: 64px; line-height: 1.3; }
      #p02 .col-r .q .mark { color: var(--accent-deep); }

      /* ---------- P03 横向文字带（主色） ---------- */
      #p03 .content { display: flex; flex-direction: column; justify-content: center; gap: 56px; padding: 0 140px 0 150px; }
      #p03 .band-a { background: var(--ink); color: var(--paper); font-family: "PHT-H"; font-size: 58px; padding: 40px 56px; letter-spacing: 0.02em; }
      #p03 .band-b { background: var(--paper); color: var(--ink); font-family: "PHT-H"; font-size: 58px; padding: 40px 56px; letter-spacing: 0.02em; }
      #p03 .band-b .hl { color: var(--accent); }

      /* ---------- P04 悬念大字（深） ---------- */
      #p04 .content { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-left: 190px; }
      #p04 .l1 { font-family: "PHT-H"; color: var(--paper); font-size: 150px; line-height: 1.12; }
      #p04 .l2 { font-family: "PHT-H"; color: var(--paper); font-size: 150px; line-height: 1.12; }
      #p04 .l2 .q { color: var(--accent); }

      /* ---------- P05 重点色块 + 引语（浅） ---------- */
      #p05 .content { display: flex; padding: 0 140px 0 150px; align-items: center; gap: 90px; }
      #p05 .col-l { flex: 0 0 54%; }
      #p05 .block { background: var(--accent); color: var(--ink); font-family: "PHT-H"; font-size: 52px; padding: 34px 44px; margin-bottom: 56px; }
      #p05 .big { font-family: "PHT-H"; color: var(--ink); font-size: 108px; line-height: 1.18; }
      #p05 .col-r { flex: 1; }
      #p05 .col-r .qmark { font-family: "PHT-H"; color: var(--accent-deep); font-size: 150px; line-height: 0.5; margin-bottom: 46px; }
      #p05 .col-r .t1 { font-family: "PHT-H"; color: var(--ink); font-size: 56px; line-height: 1.35; }
      #p05 .col-r .t2 { font-family: "PHT-H"; color: var(--ink); font-size: 56px; line-height: 1.35; margin-top: 10px; }
      #p05 .col-r .t2 .hl { color: var(--accent-deep); }

      /* ---------- P06 编号大标题 01（主色） ---------- */
      #p06 .content { display: flex; align-items: center; padding: 0 140px 0 150px; }
      #p06 .num { font-family: "PHT-H"; font-size: 340px; line-height: 1; color: transparent;
        -webkit-text-fill-color: rgba(var(--paper-rgb), 0.18); -webkit-text-stroke: 3px rgba(var(--ink-rgb), 0.85); margin-right: 90px; }
      #p06 .right { }
      #p06 .chip { display: inline-block; background: var(--ink); color: var(--accent); font-family: "PHT-H"; font-size: 34px; padding: 14px 34px; letter-spacing: 0.3em; margin-bottom: 36px; }
      #p06 .t { font-family: "PHT-H"; color: var(--ink); font-size: 96px; line-height: 1.2; }
      #p06 .s { margin-top: 26px; font-family: "PHT-H"; color: var(--ink); font-size: 52px; }

      /* ---------- P07 引语色块（深） ---------- */
      #p07 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p07 .intro { color: rgba(var(--paper-rgb), 0.75); font-size: 38px; margin-bottom: 40px; }
      #p07 .chips { display: flex; gap: 28px; margin-bottom: 68px; }
      #p07 .chip { background: var(--accent); color: var(--ink); font-family: "PHT-H"; font-size: 44px; padding: 22px 42px; }
      #p07 .b1 { color: rgba(var(--paper-rgb), 0.85); font-size: 42px; margin-bottom: 16px; }
      #p07 .b2 { font-family: "PHT-H"; color: var(--paper); font-size: 62px; line-height: 1.3; }
      #p07 .b2 .hl { color: var(--accent); }

      /* ---------- P08 开放式分栏 + 步骤（浅） ---------- */
      #p08 .content { display: flex; align-items: center; padding: 0 140px 0 150px; }
      #p08 .col-l { flex: 0 0 44%; }
      #p08 .col-l .t { font-family: "PHT-H"; color: var(--ink); font-size: 104px; line-height: 1.18; }
      #p08 .divider { width: 6px; align-self: stretch; background: var(--accent); margin: 0 80px; }
      #p08 .col-r { flex: 1; display: flex; flex-direction: column; gap: 30px; }
      #p08 .step { display: flex; align-items: center; gap: 30px; }
      #p08 .step .txt { font-family: "PHT-H"; color: var(--ink); font-size: 58px; }
      #p08 .step .arr { font-family: "PHT-H"; color: var(--accent-deep); font-size: 58px; }

      /* ---------- P09 话术引语（主色） ---------- */
      #p09 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p09 .qmark { font-family: "PHT-H"; color: var(--ink); font-size: 160px; line-height: 0.4; margin-bottom: 60px; }
      #p09 .t1 { font-family: "PHT-H"; color: var(--ink); font-size: 62px; line-height: 1.4; margin-bottom: 46px; }
      #p09 .band { background: var(--paper); color: var(--ink); font-family: "PHT-H"; font-size: 54px; padding: 36px 52px; }

      /* ---------- P10 横向文字带（深） ---------- */
      #p10 .content { display: flex; flex-direction: column; justify-content: center; gap: 64px; padding: 0 150px; }
      #p10 .band { background: var(--accent); color: var(--ink); font-family: "PHT-H"; font-size: 58px; padding: 42px 56px; }
      #p10 .cmp { display: flex; align-items: center; gap: 40px; }
      #p10 .cmp .a { color: rgba(var(--paper-rgb), 0.7); font-size: 44px; }
      #p10 .cmp .arr { font-family: "PHT-H"; color: var(--accent); font-size: 52px; }
      #p10 .cmp .b { font-family: "PHT-H"; color: var(--paper); font-size: 56px; }
      #p10 .cmp .b .hl { color: var(--accent); }

      /* ---------- P11 流程横带（浅） ---------- */
      #p11 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p11 .k { color: var(--ink); opacity: 0.6; font-size: 34px; margin-bottom: 30px; letter-spacing: 0.06em; }
      #p11 .t { font-family: "PHT-H"; color: var(--ink); font-size: 74px; margin-bottom: 70px; }
      #p11 .t .hl { color: var(--accent-deep); }
      #p11 .steps { display: flex; align-items: center; gap: 26px; }
      #p11 .step { background: var(--accent); color: var(--ink); font-family: "PHT-H"; font-size: 46px; padding: 32px 40px; white-space: nowrap; }
      #p11 .arr { font-family: "PHT-H"; color: var(--ink); font-size: 46px; opacity: 0.5; }

      /* ---------- P12 CTA 色块（主色） ---------- */
      #p12 .content { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding-left: 90px; }
      #p12 .t { font-family: "PHT-H"; color: var(--ink); font-size: 150px; line-height: 1.1; }
      #p12 .s { margin-top: 48px; font-family: "PHT-H"; color: var(--ink); font-size: 46px; }
      #p12 .s .pill { display: inline-block; background: var(--ink); color: var(--paper); padding: 10px 26px; margin: 0 8px; }

      /* ---------- P13 编号大标题 02（深） ---------- */
      #p13 .content { display: flex; align-items: center; padding: 0 140px 0 150px; }
      #p13 .num { font-family: "PHT-H"; font-size: 340px; line-height: 1; color: transparent;
        -webkit-text-fill-color: rgba(var(--paper-rgb), 0.18); -webkit-text-stroke: 3px rgba(var(--paper-rgb), 0.55); margin-right: 90px; }
      #p13 .chip { display: inline-block; background: var(--accent); color: var(--ink); font-family: "PHT-H"; font-size: 34px; padding: 14px 34px; letter-spacing: 0.3em; margin-bottom: 36px; }
      #p13 .t { font-family: "PHT-H"; color: var(--paper); font-size: 92px; line-height: 1.2; }
      #p13 .s { margin-top: 26px; font-family: "PHT-H"; color: var(--accent); font-size: 52px; }

      /* ---------- P14 引语对比（浅） ---------- */
      #p14 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p14 .intro { color: var(--ink); opacity: 0.62; font-size: 38px; margin-bottom: 50px; }
      #p14 .q { font-family: "PHT-H"; color: var(--ink); font-size: 72px; margin-bottom: 34px; }
      #p14 .q .mark { color: var(--accent); }
      #p14 .reply { font-family: "PHT-H"; color: var(--accent-deep); font-size: 62px; margin-bottom: 34px; }
      #p14 .end { color: var(--ink); opacity: 0.55; font-size: 44px; }

      /* ---------- P15 话术引语 + 箭头（主色） ---------- */
      #p15 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p15 .intro { font-family: "PHT-H"; color: var(--ink); font-size: 46px; margin-bottom: 44px; }
      #p15 .q { font-family: "PHT-H"; color: var(--ink); font-size: 66px; line-height: 1.35; margin-bottom: 60px; }
      #p15 .steps { display: flex; align-items: center; gap: 30px; }
      #p15 .step { background: var(--paper); color: var(--ink); font-family: "PHT-H"; font-size: 48px; padding: 30px 44px; white-space: nowrap; }
      #p15 .arr { font-family: "PHT-H"; color: var(--ink); font-size: 48px; }

      /* ---------- P16 重点色块（深） ---------- */
      #p16 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p16 .block { background: var(--accent); color: var(--ink); font-family: "PHT-H"; font-size: 58px; padding: 36px 48px; margin-bottom: 60px; }
      #p16 .b1 { color: rgba(var(--paper-rgb), 0.8); font-size: 44px; margin-bottom: 20px; }
      #p16 .b2 { font-family: "PHT-H"; color: var(--paper); font-size: 74px; line-height: 1.3; }
      #p16 .b2 .hl { color: var(--accent); }

      /* ---------- P17 编号大标题 03（浅） ---------- */
      #p17 .content { display: flex; align-items: center; padding: 0 140px 0 150px; }
      #p17 .num { font-family: "PHT-H"; font-size: 340px; line-height: 1; color: transparent;
        -webkit-text-fill-color: rgba(var(--ink-rgb), 0.18); -webkit-text-stroke: 3px rgba(var(--ink-rgb), 0.45); margin-right: 90px; }
      #p17 .chip { display: inline-block; background: var(--accent); color: var(--ink); font-family: "PHT-H"; font-size: 34px; padding: 14px 34px; letter-spacing: 0.3em; margin-bottom: 36px; }
      #p17 .t { font-family: "PHT-H"; color: var(--ink); font-size: 92px; line-height: 1.2; }
      #p17 .s { margin-top: 26px; font-family: "PHT-H"; color: var(--accent-deep); font-size: 52px; }

      /* ---------- P18 开放式分栏（主色） ---------- */
      #p18 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p18 .intro { font-family: "PHT-H"; color: var(--ink); font-size: 76px; margin-bottom: 70px; }
      #p18 .cols { display: flex; gap: 56px; }
      #p18 .card { flex: 1; background: var(--paper); color: var(--ink); font-family: "PHT-H"; font-size: 42px; line-height: 1.45; padding: 48px 44px; min-height: 300px; }

      /* ---------- P19 对比横带（深） ---------- */
      #p19 .content { display: flex; flex-direction: column; justify-content: center; gap: 56px; padding: 0 150px; }
      #p19 .do { background: var(--accent); color: var(--ink); font-family: "PHT-H"; font-size: 50px; line-height: 1.4; padding: 42px 54px; }
      #p19 .do .hl { color: var(--paper); }
      #p19 .dont { color: rgba(var(--paper-rgb), 0.85); font-size: 42px; line-height: 1.4; padding: 0 12px; }
      #p19 .dont .no { color: var(--accent); font-family: "PHT-H"; }
      #p19 .dont .q { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 4px; }

      /* ---------- P20 总结引语（浅） ---------- */
      #p20 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p20 .q { font-family: "PHT-H"; color: var(--ink); font-size: 108px; line-height: 1.18; margin-bottom: 54px; }
      #p20 .b1 { color: var(--ink); opacity: 0.62; font-size: 42px; margin-bottom: 18px; }
      #p20 .b2 { font-family: "PHT-H"; color: var(--ink); font-size: 62px; line-height: 1.35; }
      #p20 .b2 .hl { color: var(--accent-deep); }

      /* ---------- P21 结尾清单（主色） ---------- */
      #p21 .content { display: flex; flex-direction: column; justify-content: center; padding: 0 150px; }
      #p21 .t { font-family: "PHT-H"; color: var(--ink); font-size: 104px; line-height: 1.18; margin-bottom: 66px; }
      #p21 .lines { display: flex; flex-direction: column; gap: 28px; }
      #p21 .line { display: flex; align-items: center; gap: 26px; font-family: "PHT-H"; color: var(--ink); font-size: 48px; }
      #p21 .line .ck { color: var(--ink); font-size: 52px; }
      #p21 .note, #p21 .note2 { color: var(--ink); opacity: 0.72; font-size: 34px; }
      #p21 .note { margin-top: 66px; }
      #p21 .note2 { margin-top: 14px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-fps="30" data-duration="<AUDIO_DURATION>">

      <!--
        ============================================================
        复制 section 模式扩展实际页数。每个 section：
          <section id="pNN" class="clip pg-{dark|light|orange}" data-start="…" data-duration="…">
        data-start = 页面切换绑定词的开始时间（帧级 ceil(t×30)/30）；
        data-duration = 下一页 start − 本页 start（末页 = 音频总时长 − start）；
        内容单元 data-u = 绑定词绝对时间 − 页面 data-start（秒）。
        复制对应 #pNN 样式块并改用你的页 id。
        示例三页：P01 大标题（深）、P02 开放式分栏（浅）、P11 流程横带（浅）。
        ============================================================
      -->

      <!-- ============ P01 大标题压屏（深） ============ -->
      <section id="p01" class="clip pg-dark" data-start="0.2" data-duration="1.2">
        <div class="page">
          <div class="grid"></div>
          <div class="brand">BRAND_EN</div>
          <div class="brand-v">BRAND_ZH</div>
          <div class="content">
            <div class="rule" data-u="0" data-kind="fade"></div>
            <div class="t" data-u="0.1" data-kind="rise">标题示例</div>
            <div class="k" data-u="0.9" data-kind="fade">副标题示例</div>
          </div>
          <div class="pageno"><b>01</b><i>/ NN</i></div>
        </div>
      </section>

      <!-- ============ P02 开放式分栏（浅） ============ -->
      <section id="p02" class="clip pg-light" data-start="1.4" data-duration="2.4">
        <div class="page">
          <div class="grid"></div>
          <div class="brand">BRAND_EN</div>
          <div class="brand-v">BRAND_ZH</div>
          <div class="content">
            <div class="col-l">
              <div class="a" data-u="0" data-kind="slidel">左栏主句示例</div>
              <div class="b" data-u="1.2" data-kind="slidel">左栏次句示例</div>
            </div>
            <div class="divider" data-u="0.6" data-kind="fade"></div>
            <div class="col-r">
              <div class="who" data-u="1.4" data-kind="fade">右栏标签示例</div>
              <div class="q" data-u="1.9" data-kind="fade">右栏引语示例</div>
            </div>
          </div>
          <div class="pageno"><b>02</b><i>/ NN</i></div>
        </div>
      </section>

      <!-- ============ P03 流程横带（浅，样式见 #p11） ============ -->
      <section id="p11" class="clip pg-light" data-start="3.8" data-duration="3.4">
        <div class="page">
          <div class="grid"></div>
          <div class="brand">BRAND_EN</div>
          <div class="brand-v">BRAND_ZH</div>
          <div class="content">
            <div class="k" data-u="0" data-kind="fade">流程标签示例</div>
            <div class="t" data-u="0.4" data-kind="rise">流程标题示例</div>
            <div class="steps">
              <div class="step" data-u="1.0" data-kind="rise">步骤一</div>
              <div class="arr" data-u="1.0" data-kind="fade">→</div>
              <div class="step" data-u="1.9" data-kind="rise">步骤二</div>
              <div class="arr" data-u="1.9" data-kind="fade">→</div>
              <div class="step" data-u="2.6" data-kind="rise">步骤三</div>
            </div>
          </div>
          <div class="pageno"><b>03</b><i>/ NN</i></div>
        </div>
      </section>

      <!-- 口播音轨：data-duration = 音频总时长 -->
      <audio id="vo" src="media/voiceover.mp3" data-start="0" data-duration="<AUDIO_DURATION>" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var clips = document.querySelectorAll("section.clip");
        var last = clips[clips.length - 1];
        var LAST_END = parseFloat(document.getElementById("root").getAttribute("data-duration"));

        clips.forEach(function (sec) {
          var S = parseFloat(sec.getAttribute("data-start"));
          var D = parseFloat(sec.getAttribute("data-duration"));
          var E = S + D;
          var page = sec.querySelector(".page");

          // 页面快速淡入（0.12s ease-out）
          tl.fromTo(page, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: true }, S);

          // 内容单元：0.38s ease-out 短距滑入/淡入（整句整卡为一个动画主体）
          sec.querySelectorAll("[data-u]").forEach(function (el) {
            var off = parseFloat(el.getAttribute("data-u")) || 0;
            var kind = el.getAttribute("data-kind") || "fade";
            var from = { opacity: 0 };
            if (kind === "rise") { from.y = 36; }
            else if (kind === "rise2") { from.y = 48; }
            else if (kind === "slidel") { from.x = -48; }
            else if (kind === "slider") { from.x = 48; }
            tl.fromTo(el, from, { opacity: 1, y: 0, x: 0, duration: 0.38, ease: "power2.out", immediateRender: true }, S + off);
          });

          // 页面快速淡出（0.12s），最后一页结尾淡出至黑
          if (sec === last) {
            tl.to(page, { opacity: 0, duration: 0.4, ease: "power2.in" }, LAST_END - 0.4);
          } else {
            tl.to(page, { opacity: 0, duration: 0.12, ease: "power2.in" }, E - 0.12);
          }
        });

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
